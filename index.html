    });

      const v=s.values[i],xx=kind==='Stacked bar'?x(i)-bw/2:x(i)-bw/2+j*step,ww=kind==='Stacked bar'?bw:step*.9,yy=kind==='Stacked bar'?y(base+v):y(v);base+=v;
      out+=`<rect x="${xx}" y="${yy}" width="${Math.max(1,ww)}" height="${v/max*ph}" rx="${small?1:2}" fill="${s.color||C[j]}" ${forecastAt!==null&&i>=forecastAt?'opacity=".6"':''}><title>${esc(label)} · ${esc(s.name)}: ${num(v,2)} ${unit}</title></rect>`;
    });});

  }
  function horizontal(rows,small=false,unit='bbl'){

    const max=unit==='%'?100:Math.max(1,...rows.map(r=>r.value))*1.08;

      if(!small)out+=`<text x="${L-14}" y="${yy+bh/2+4}" text-anchor="end" fill="#52677f" font-size="12">${esc(r.name)}</text><text x="${w-R+12}" y="${yy+bh/2+4}" fill="#243d59" font-size="12">${num(r.value,unit==='%'?0:1)}${unit==='%'?'%':''}</text>`;

  function donut(rows,small=false,unit=''){

  function chartData(id,when='current'){

</script><script>
(function (root) {
  'use strict';
  const KEY = 'lme-spare-parts-demo-v1';
  const OPEN = ['Pending approval', 'Approved', 'Partially received'];
  const STATUSES = OPEN.concat(['Received', 'Cancelled']);
  const ROLES = ['Supervisor', 'Technician', 'HSE Supervisor'];
  const clone = value => JSON.parse(JSON.stringify(value));
  const own = (value, key) => Object.prototype.hasOwnProperty.call(value, key);
  const plain = value => value && typeof value === 'object' && !Array.isArray(value);
  const fail = message => { throw new Error(message); };

    if (value == null) value = '';
    if (typeof value !== 'string') fail(label + ' must be text.');
    value = value.trim();
    if (required && !value) fail(label + ' is required.');
    if (value.length > 2000) fail(label + ' is too long.');
    return value;
  };
  const count = (value, label, nullable = true) => {
    if (nullable && (value == null || value === '')) return null;
    if (typeof value !== 'number' || !Number.isSafeInteger(value) || value < 0) fail(label + ' must be a whole, nonnegative number.');
    return value;
  };
  const positive = (value, label) => {
    value = count(value, label, false);
    if (value === 0) fail(label + ' must be greater than zero.');
    return value;
  };
  const cost = value => {
    if (value == null || value === '') return null;
    if (typeof value !== 'number' || !Number.isFinite(value) || value < 0) fail('Unit cost must be a nonnegative number or blank.');
    return value;
  };
  const date = value => typeof value === 'string' && Number.isFinite(Date.parse(value));

  function create(options) {
    options = options || {};
    const sites = new Map((options.sites || []).map(s => [s.site_id, { site_id: s.site_id }]));
    const assets = new Map((options.assets || []).map(a => [a.asset_id, { asset_id: a.asset_id, site_id: a.site_id }]));
    const getRole = typeof options.getRole === 'function' ? options.getRole : () => '';
    let storage = null;
    let status = { available: false, mode: 'memory', error: '', invalidData: false };
    try {
      storage = own(options, 'storage') ? options.storage : root.localStorage;
      if (storage && typeof storage.getItem === 'function' && typeof storage.setItem === 'function' && typeof storage.removeItem === 'function') {
        status.available = true; status.mode = 'local';
      } else { storage = null; status.error = 'Browser storage is unavailable; changes last for this page session.'; }
    } catch (_) { status.error = 'Browser storage is unavailable; changes last for this page session.'; }
    let sequence = 0;
    const fresh = () => ({ items: [], orders: [], siteRules: Object.fromEntries([...sites.keys()].map(id => [id, { enabled: false }])), activity: [] });
    let state = fresh();
    function site(id) { if (!sites.has(id)) fail('Choose a valid site.'); return id; }
    function scope(id) { if (id !== 'all') site(id); return id; }
    function role(permissions) {
      const current = getRole();
      if (!ROLES.includes(current) || !permissions.includes(current)) fail('This action is not available for your role.');
      return current;
    }
    const supervisor = () => role(['Supervisor']);
    const movement = () => role(['Supervisor', 'Technician']);
    function now() {
      const value = options.clock ? options.clock() : new Date();
      const d = new Date(value);
      if (!Number.isFinite(d.getTime())) fail('The demo clock returned an invalid date.');
      return d.toISOString();
    }
    function next(prefix) { sequence += 1; return prefix + String(sequence).padStart(6, '0'); }
    function item(id) { return state.items.find(i => i.id === id) || fail('Spare part was not found.'); }
    function order(id) { return state.orders.find(o => o.id === id) || fail('Replenishment request was not found.'); }
    function normalizedItem(input, old) {
      if (!plain(input)) fail('Part details are required.');
      const result = Object.assign({}, old || {}, input);
      site(result.site_id);
      if (old && result.site_id !== old.site_id) fail('A part cannot move between sites. Add a separate part at the other site.');
      result.asset_id = result.asset_id == null || result.asset_id === '' ? null : result.asset_id;
      if (result.asset_id !== null && (!assets.has(result.asset_id) || assets.get(result.asset_id).site_id !== result.site_id)) fail('The equipment must belong to the selected site.');
      result.sku = text(result.sku, 'SKU', true);
      result.name = text(result.name, 'Part name', true);
      result.on_hand = count(result.on_hand, 'On-hand quantity');
      result.reorder_point = count(result.reorder_point, 'Reorder point');

  function otherSites(m,compact=false){const others=allSites().filter(s=>s.site_id!==m.site_id).sort((a,b)=>a.site_id==='S04'?-1:b.site_id==='S04'?1:b.parts_wait_hours-a.parts_wait_hours);return `<div class="af-other-sites ${compact?'compact':''}" aria-label="Other five sites, 2025 source context">${others.map(s=>`<button class="af-site-card ${s.site_id==='S04'?'priority':''}" data-af-site="${s.site_id}" aria-label="View ${safe(s.site_name)} parts evidence"><span>${safe(s.site_name)}</span><strong>${fmt(s.parts_wait_hours)} <small>h</small></strong><span class="af-site-meta">${fmt(s.source_spare_fill_pct,0)}% source fill · ${s.parts_affected_events} events</span></button>`).join('')}</div>`;}
  function renderPartsSummary(){const m=metrics(focus());return `<section class="af-summary" aria-label="Historical spare-parts priority"><div class="af-summary-focus"><div class="af-eyebrow">2025 workbook history</div><div class="af-summary-site">${safe(m.site_name)}</div><h2>${fmt(m.parts_wait_hours)} <span>hours waiting for parts</span></h2><div class="af-summary-metrics"><span title="Case planning assumption; not an inventory count"><strong>${fmt(m.source_spare_fill_pct,0)}%</strong> local fill · case baseline</span><span><strong>${m.parts_affected_events}</strong> affected events</span><span><strong>${fmt(m.parts_share_pct)}%</strong> of site downtime</span><span><strong>${fmt(m.company_parts_wait_share_pct)}%</strong> of company parts wait</span></div></div><div class="af-summary-chart"><h3>Monthly parts wait <span>h · 2025</span></h3>${monthly(m,true)}</div><div class="af-summary-chart"><h3>By asset <span>equipment-hours</span></h3>${horizontal(m.assets.map(a=>({name:a.asset_id,value:a.parts_wait_hours,color:a.parts_wait_hours===m.assets[0].parts_wait_hours?TEAL:PALE})),{small:true})}</div><div class="af-summary-bottom"><span>Other 5 sites · 2025 parts-wait hours</span>${otherSites(m,true)}</div></section>`;}
  function hero(m){const rank=allSites().findIndex(s=>s.site_id===m.site_id)+1,priority=m.site_id==='S04';return `<section class="af-hero"><div class="af-hero-copy"><div class="af-eyebrow">${priority?'Priority site':'Selected site'} · 2025 unplanned outages</div><h2>${safe(m.site_name)} <span>Parts availability</span></h2><p>${priority?'Highest parts-wait hours. Lowest source local fill.':'Rank '+rank+' of 6 for annual parts-wait hours.'}</p><div class="af-hero-tags"><span>${m.parts_affected_events} affected events${priority?' · most among sites':''}</span><span>${fmt(m.company_parts_wait_share_pct)}% of company parts wait</span></div></div><div class="af-hero-value"><span>Parts-wait hours</span><strong>${fmt(m.parts_wait_hours)} <small>h</small></strong><span>${fmt(m.parts_share_pct)}% of this site’s unplanned downtime</span></div><div class="af-hero-value af-fill"><span>Source local fill</span><strong>${fmt(m.source_spare_fill_pct,0)}<small>%</small></strong><span>Case baseline · not a stock count</span></div></section>`;}
  function renderDashboard(){const m=metrics(focus()),all=allSites(),c=comparison(m.site_id),s=scenario(m.site_id),priority=m.site_id==='S04';
    const compareTable=`<table class="af-comparison"><thead><tr><th>Historical measure</th><th>${safe(m.site_name)}</th><th>Other 5</th></tr></thead><tbody><tr><td>Annual parts wait</td><td>${fmt(m.parts_wait_hours)} h</td><td>${fmt(c.other_site_mean_parts_wait_hours)} h</td></tr><tr><td>Affected events</td><td>${m.parts_affected_events}</td><td>${fmt(c.other_site_mean_affected_events)}</td></tr><tr><td>Source local fill</td><td>${fmt(m.source_spare_fill_pct,0)}%</td><td>${fmt(c.other_site_mean_source_spare_fill_pct)}%</td></tr><tr><td>Wait / affected event</td><td>${fmt(m.avg_parts_wait_per_affected_event,2)} h</td><td>${fmt(c.other_sites_combined_avg_wait_per_affected_event,2)} h</td></tr></tbody></table>`;
    const critical=m.hse.critical_actions.map(h=>`<button class="af-action-link" data-af-hse="${safe(h.id)}" data-af-site-id="${safe(h.site_id)}"><strong>${safe(h.id)}</strong><span>${safe(h.hazard)}</span><span aria-hidden="true">→</span></button>`).join('');
    return `<div class="af-dashboard"><div class="af-context"><span>${safe(m.site_name)} focus${state.site==='all'?' · All-sites filter':''}</span><span>Comparisons: all 6 sites · Jan–Dec 2025</span></div>${hero(m)}<div class="af-sites-label"><span>Other sites</span><span>Parts-wait hours · source local fill</span></div>${otherSites(m)}<div class="af-chart-grid">${card('Where parts waits concentrate',horizontal(all.map(r=>({name:r.site_name,value:r.parts_wait_hours,color:r.site_id==='S04'?TEAL:r.site_id===m.site_id?BLUE:PALE})))+source('All six sites · Arroyo highlighted'),dataButton('ranking',m.site_id))}${card(m.site_name+' · monthly parts wait',monthly(m)+source('Unplanned events · historical pattern'),dataButton('monthly',m.site_id))}${card(m.site_name+' · asset breakdown',horizontal(m.assets.map(a=>({name:a.asset_id,value:a.parts_wait_hours,color:a.parts_wait_hours===m.assets[0].parts_wait_hours?TEAL:PALE})))+source('Source assets · equipment-hours'),dataButton('assets',m.site_id))}</div><div class="af-bottom-grid">${card('Put the site in context',compareTable+source('Other 5: unweighted mean of site totals. Wait/event uses combined hours ÷ events.')+`<div class="af-insight">${priority?'Arroyo has more affected events; mean wait per event is similar to other sites.':'Compare total exposure and per-event delay separately.'}</div>`)}${card('Potential HSE severity',`<div class="af-hse-top"><strong>${m.hse.open_count}<span>open</span></strong><strong>${m.hse.critical_open_count}<span>severity 5</span></strong><span>Source-open actions<br>Oct 1, 2026</span></div><div class="af-hse-bars">${m.hse.severity.map(h=>`<div><span>Severity ${h.severity}</span><div><i style="width:${Math.max(0,h.count/Math.max(1,...m.hse.severity.map(x=>x.count))*100)}%;background:${h.severity===5?'#9a627a':PALE}"></i></div><strong>${h.count}</strong></div>`).join('')}</div>${critical?`<div class="af-critical-actions">${critical}</div>`:'<div class="af-source">No source-open severity-5 actions at this site.</div>'}${source('Severity is potential consequence; no incident forecast.')}`)}${card('O4 · parts-wait scenario',`<div class="af-scenario-number"><strong>${fmt(s.saved_parts_wait_hours)} <small>h</small></strong><span>parts-wait hours potentially avoided</span></div><div class="af-scenario-bars">${[['Historical',s.baseline_parts_wait_hours,PALE],['O4 scenario',s.remaining_parts_wait_hours,TEAL]].map(([l,v,color])=>`<div><span>${l}</span><div><i style="width:${v/s.baseline_parts_wait_hours*100}%;background:${color}"></i></div><strong>${fmt(v)} h</strong></div>`).join('')}</div><div class="af-scenario-note"><strong>60% parts-wait reduction</strong><span>Full comparable year after implementation. Other stages and safety work unchanged.</span></div>${source('Modeled, not observed · Solutions!S5; J5:K5')}`,dataButton('scenario',m.site_id))}</div>${source('CaseQuest2026Dataset.xlsx · Assets / Events / HSE / Solutions · historical records and labeled scenario; no live feed or inventory balances inferred.')}</div>`;
  }
  window.ArroyoInsights=Object.freeze({renderDashboard,renderPartsSummary,metrics,comparison,scenario,allSites,focus});
})();

</script><script>
/* User-entered spare-parts demo. Historical workbook evidence remains separate. */
(() => {
  'use strict';
  let tab='inventory',query='',filter='all',page=0,dialogState=null;
  const E=s=>esc(s),N=n=>n==null?'—':num(n,0), isSup=()=>state.role==='Supervisor', canMove=()=>['Supervisor','Technician'].includes(state.role);
  const statuses=['Pending approval','Approved','Partially received','Received','Cancelled'];
  const defaultSite=()=>state.site!=='all'?state.site:DATA.sites.find(s=>s.site_id==='S04')?.site_id||DATA.sites.find(s=>s.site_name==='Arroyo')?.site_id||DATA.sites[0].site_id;
  function store(){if(!window.PartsStore){let storage=null;try{storage=window.localStorage;}catch{}window.PartsStore=window.SparePartsModel.create({sites:DATA.sites,assets:DATA.assets,getRole:()=>state.role,storage});}return window.PartsStore;}
  const snapshot=()=>store().snapshot(),inScope=x=>state.site==='all'||x.site_id===state.site,items=()=>store().getItems().filter(inScope);
  const allOrders=()=>store().getOrders?store().getOrders():snapshot().orders.map(o=>({...o,remaining_quantity:o.quantity-o.received_quantity})),orders=()=>allOrders().filter(inScope);
  const item=id=>store().getItems().find(x=>x.id===id),order=id=>allOrders().find(x=>x.id===id),openOrders=()=>orders().filter(o=>!['Received','Cancelled'].includes(o.status));
  const rule=id=>{const r=snapshot().siteRules;return Array.isArray(r)?r.find(x=>x.site_id===id)||{enabled:false}:r[id]||{enabled:false};};
  const tick=on=>on?'checked':'',moneyCell=v=>v==null?'Not supplied':money(v),stamp=s=>s?new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' UTC':'—';
  const btn=(label,action,id='',cls='secondary small',disabled=false)=>`<button type="button" class="btn ${cls}" data-sp-action="${action}" data-sp-id="${E(id)}" ${disabled?'disabled':''}>${E(label)}</button>`;
  const table=(heads,rows)=>`<div class="table-wrap sp-table"><table><thead><tr>${heads.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const statusBadge=s=>badge(s==='On order'?'Request open':s,s==='Received'||s==='In stock'?'success':s==='Reorder needed'?'critical':['Pending approval','Partially received','Unconfigured'].includes(s)?'warning':'neutral');
  const field=(label,control,help='',full=false)=>`<label class="sp-field ${full?'full':''}">${E(label)}${control}${help?`<small>${E(help)}</small>`:''}</label>`;
  const input=(id,value='',extra='')=>`<input id="sp-${id}" value="${E(value??'')}" ${extra}>`,select=(id,opts,value)=>`<select id="sp-${id}">${opts.map(([v,l])=>`<option value="${E(v)}" ${String(v)===String(value)?'selected':''}>${E(l)}</option>`).join('')}</select>`;
  const textarea=(id,placeholder='Required note')=>`<textarea id="sp-${id}" rows="3" placeholder="${E(placeholder)}" maxlength="500"></textarea>`;
  const val=id=>document.getElementById('sp-'+id)?.value??'',number=id=>val(id)===''?null:Number(val(id));
  function refresh(){if(location.hash==='#parts'||current==='parts')render();}
  function showTab(next){if(!['inventory','orders','automation'].includes(next))return;tab=next;page=0;query='';filter='all';if(location.hash==='#parts')refresh();}
  function resetView(){query='';filter='all';page=0;if(document.querySelector('#modal-body .sp-dialog')){modal.close();document.getElementById('modal-body').innerHTML='';}dialogState=null;}
  function paginate(rows,size=6){page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));return rows.slice(page*size,(page+1)*size);}
  function pagination(total,size=6){return `<div class="sp-pagination"><span>${total?page*size+1:0}–${Math.min(total,(page+1)*size)} of ${total}</span><div>${btn('Previous','prev','','secondary small',page===0)}${btn('Next','next','','secondary small',(page+1)*size>=total)}</div></div>`;}
  function baseline(){const sites=selectedSites(),sourceEvents=DATA.events.filter(e=>e.event_type==='Unplanned');return `<details class="sp-source" ${items().length||window.ArroyoInsights?.renderPartsSummary?'':'open'}><summary>Workbook evidence <small>2025 · historical source values</small></summary>${table(['Site','Source spare fill','Parts-wait hours','Affected events'],sites.map(s=>{const ev=sourceEvents.filter(e=>e.site_id===s.site_id);return `<tr><td><strong>${E(s.site_name)}</strong></td><td>${num(s.spare_fill_pct,0)}%</td><td>${num(sum(ev,'parts_wait_hours'))} h</td><td>${ev.filter(e=>e.parts_wait_hours>0).length}</td></tr>`;}))}<div class="sp-source-foot">Assets / Events · ${E(DATA.meta.file)}. Spare-fill rates are source inputs, not inventory balances.</div></details>`;}
  function inventory(){const all=items(),list=all.filter(i=>(filter==='all'||i.stock_state===filter)&&(!query||(i.sku+' '+i.name+' '+siteName(i.site_id)+' '+(i.asset_id||'')).toLowerCase().includes(query.toLowerCase())));const top=`<div class="sp-toolbar"><div><input id="sp-search" aria-label="Search inventory" placeholder="Search parts or SKU" value="${E(query)}"><select id="sp-status" aria-label="Stock status"><option value="all">All stock states</option>${['Unconfigured','Reorder needed','On order','In stock'].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select></div>${isSup()?`<div>${btn('Add part','add','','')}${btn('Try demo','demo')}</div>`:''}</div>`;
    if(!all.length)return `<section class="panel sp-tracker-empty"><div class="sp-empty"><div class="sp-empty-icon">${icon('box')}</div><div class="sp-empty-copy"><h3>No demo inventory yet</h3><p>Workbook stock quantities are not supplied. Add a part or try the demo.</p></div><div class="sp-actions">${isSup()?btn('Add part','add','','')+btn('Try demo','demo'):'<span class="subtle">A Supervisor can add demo inventory.</span>'}</div></div></section>`;
    const body=paginate(list).map(i=>`<tr><td class="sp-item"><strong>${E(i.name)}</strong><small>${E(i.sku)}${i.asset_id?' · '+E(i.asset_id):''}</small></td><td>${E(siteName(i.site_id))}</td><td class="sp-number">${N(i.on_hand)}</td><td class="sp-number">${N(i.reorder_point)}</td><td class="sp-number">${N(i.target_stock)}</td><td class="sp-number">${N(i.on_order)}</td><td>${statusBadge(i.stock_state)}</td><td><div class="sp-actions">${canMove()?btn('Issue','issue',i.id,'secondary small',i.on_hand==null||i.on_hand===0)+btn('Count','count',i.id):''}${btn(isSup()?'Edit':'View','item',i.id)}</div></td></tr>`);
    return top+`<section class="panel"><div class="panel-head"><h2>Tracked parts</h2>${badge('User-entered demo')}</div>${body.length?table(['Part / SKU','Site','On hand','Reorder','Target','Open qty','Status',''],body):'<div class="empty">No matching parts</div>'}${pagination(list.length)}</section>`;
  }
  function activity(){const list=snapshot().activity.filter(inScope).slice().reverse().slice(0,12);return `<details class="sp-source"><summary>Demo activity <small>Saved in this browser</small></summary><div class="sp-activity">${list.length?list.map(a=>`<div class="sp-activity-row"><time>${E(stamp(a.at))}</time><div><strong>${E(a.action)}</strong><small>${E(a.actor)} · ${E(siteName(a.site_id))}${a.notes?' · '+E(a.notes):''}${a.quantity!=null?' · Qty '+N(a.quantity):''}</small></div></div>`).join(''):'<div class="empty">No inventory activity yet</div>'}</div></details>`;}
  function orderView(){const list=orders().filter(o=>(filter==='all'||o.status===filter)&&(!query||(o.id+' '+(item(o.item_id)?.name||'')+' '+siteName(o.site_id)).toLowerCase().includes(query.toLowerCase()))).slice().reverse();return `<div class="sp-toolbar"><div><input id="sp-search" aria-label="Search orders" placeholder="Search orders or parts" value="${E(query)}">${select('status',[['all','All order states'],...statuses.map(s=>[s,s])],filter)}</div>${isSup()?btn('Check stock','check'):'<span class="subtle">Requests stay local until reviewed.</span>'}</div><section class="panel"><div class="panel-head"><h2>Replenishment requests</h2>${badge('No supplier connection')}</div>${list.length?table(['Request','Part / site','Requested','Received','Remaining','Status',''],paginate(list).map(o=>{const i=item(o.item_id);return `<tr><td><strong>${E(o.id)}</strong></td><td class="sp-item"><strong>${E(i?.name||o.item_id)}</strong><small>${E(siteName(o.site_id))}</small></td><td>${N(o.quantity)}</td><td>${N(o.received_quantity)}</td><td>${N(o.remaining_quantity)}</td><td>${statusBadge(o.status)}</td><td>${btn('View','order',o.id)}</td></tr>`}))+pagination(list.length):'<div class="sp-empty"><h3>No replenishment requests</h3><p>Enabled site rules create requests when stock reaches its reorder point.</p></div>'}</section>`+activity();}
  function automation(){return `<section class="panel"><div class="panel-head"><h2>Site replenishment rules</h2>${isSup()?btn('Check stock','check'):badge('Read only')}</div>${table(['Site','Automation','Configured parts','Open requests',''],selectedSites().map(s=>{const all=store().getItems().filter(i=>i.site_id===s.site_id),configured=all.filter(i=>i.on_hand!=null&&i.reorder_point!=null&&i.target_stock!=null),open=allOrders().filter(o=>o.site_id===s.site_id&&!['Received','Cancelled'].includes(o.status));return `<tr><td><strong>${E(s.site_name)}</strong></td><td><label class="sp-rule"><input type="checkbox" data-sp-rule="${E(s.site_id)}" ${tick(rule(s.site_id).enabled)} ${isSup()?'':'disabled'}> ${rule(s.site_id).enabled?'Enabled':'Off'}</label></td><td>${configured.length} / ${all.length}</td><td>${open.length}</td><td>${isSup()?btn('Add part','add-site',s.site_id):''}</td></tr>`;}))}<div class="sp-rule-note">Demo inventory position = on hand + open request quantity. At or below the reorder point → request the gap to target. A Supervisor approves each request.</div></section>${isSup()?`<div class="sp-toolbar"><span class="subtle">Automation never sends an order to a supplier.</span>${btn('Reset spare-parts demo','reset','','secondary small')}</div>`:''}`;}
  function trackingSummary(all,os,selected){
    const missing=all.filter(i=>i.on_hand==null).length,needs=all.filter(i=>i.stock_state==='Reorder needed').length,stages=[['In stock','ready'],['Reorder needed','low'],['On order','requested'],['Unconfigured','unknown']].map(([key,color])=>({key,color,label:key==='On order'?'Request open':key,count:all.filter(i=>i.stock_state===key).length}));
    const requestRows=orders(),progress=[['Pending approval','Pending'],['Approved','Approved'],['Partially received','Partial'],['Received','Received']],cancelled=requestRows.filter(o=>o.status==='Cancelled').length;
    return `<div class="sp-tracker-kpis">${stat('Tracked SKUs',all.length,missing?missing+' stock count'+(missing===1?'':'s')+' missing':all.length?'All stock counts entered':'Demo records only')}${stat('Reorder needed',needs,'Configured parts',needs?'critical':'')}${stat('Open requests',os.length,'Awaiting approval / receipt')}${stat('Rules enabled',selected.filter(s=>rule(s.site_id).enabled).length+' / '+selected.length,'Selected sites')}</div><div class="sp-tracker-meters"><section class="sp-stock-summary" aria-label="Demo stock status"><div class="sp-meter-heading"><h3>Stock status</h3><span>${all.length?all.length+' tracked SKU'+(all.length===1?'':'s'):'No demo stock records'}</span></div><div class="sp-stock-meter" role="img" aria-label="${E(all.length?stages.map(s=>s.label+': '+s.count).join(', '):'No demo stock records. Workbook quantities are not supplied.')}" >${all.length?stages.filter(s=>s.count).map(s=>`<span class="sp-stock-segment sp-stock-${s.color}" style="width:${s.count/all.length*100}%" title="${E(s.label)}: ${s.count}"></span>`).join(''):'<span class="sp-stock-placeholder"></span>'}</div><div class="sp-stock-key">${stages.map(s=>`<span><i class="sp-stock-${s.color}"></i>${E(s.label)} <strong>${s.count}</strong></span>`).join('')}</div></section><section class="sp-request-summary" aria-label="Demo request progress"><div class="sp-meter-heading"><h3>Request progress</h3><span>${cancelled?cancelled+' cancelled':'Demo requests'}</span></div><div class="sp-request-counts">${progress.map(([key,label])=>`<div><strong>${requestRows.filter(o=>o.status===key).length}</strong><span>${label}</span></div>`).join('')}</div></section></div>`;
  }
  function view(){const all=items(),os=openOrders(),selected=selectedSites(),storageState=store().storageStatus(),mode=storageState.mode,summary=typeof window.ArroyoInsights?.renderPartsSummary==='function'?window.ArroyoInsights.renderPartsSummary():'';return `<div class="sp-workspace">${summary}<section class="sp-tracker" aria-labelledby="sp-tracker-title"><div class="sp-tracker-heading"><div><h2 id="sp-tracker-title">Inventory tracker</h2><p>Browser-local demo · separate from workbook history</p></div><span class="sp-tracker-scope">${state.site==='all'?'All sites':E(siteName(state.site))}</span></div><div class="sp-note sp-tracker-storage"><span>${storageState.error?E(storageState.error):mode==='memory'?'Session only; browser storage unavailable.':'Saved in this browser.'} No supplier connection.</span><span>${E(state.role)} view</span></div>${trackingSummary(all,os,selected)}<div class="sp-tabs" role="tablist">${[['inventory','Inventory'],['orders','Orders'],['automation','Automation']].map(([id,l])=>`<button class="sp-tab ${tab===id?'active':''}" data-sp-action="tab" data-sp-id="${id}" role="tab" aria-selected="${tab===id}">${l}${id==='orders'&&os.length?`<span class="badge neutral">${os.length}</span>`:''}</button>`).join('')}</div>${({inventory,orders:orderView,automation})[tab]()}</section>${baseline()}</div>`;}
  function dialog(title,body,ctx){dialogState=ctx;openModal(title,`<div class="sp-dialog">${body}<div class="sp-error" id="sp-error" role="alert"></div></div>`);}
  const note=()=>'<div class="sp-note">User-entered demo data · separate from workbook records</div>';
  const footer=(label,action,id='')=>`<div class="sp-dialog-footer">${btn('Cancel','close')}${btn(label,action,id,'')}</div>`;
  function assetOptions(site){return [['','Site-level spare'],...DATA.assets.filter(a=>a.site_id===site).map(a=>[a.asset_id,a.asset_id+' · '+a.asset_type])];}
  function openAdd(site){if(!isSup())return false;openItem(null,site);return true;}
  function openItem(id,site){const i=id?item(id):null;if(id&&(!i||!inScope(i)))return false;const editing=!!i,readOnly=!isSup(),sid=i?.site_id||site||defaultSite(),lock=readOnly?'disabled':'';
    const siteSelect=select('site',DATA.sites.map(s=>[s.site_id,s.site_name]),sid).replace('<select','<select '+(editing?'disabled':''));const fields=field('Site',siteSelect)+field('Asset',select('asset',assetOptions(sid),i?.asset_id||'').replace('<select','<select '+lock))+field('SKU',input('sku',i?.sku||'',`maxlength="60" required ${lock}`))+field('Part name',input('name',i?.name||'',`maxlength="100" required ${lock}`))+(editing?field('On hand',input('on-hand',i?.on_hand,'disabled'),'Use Count to record a stock adjustment.'):field('Opening count',input('on-hand','',`type="number" min="0" step="1"`),'Leave blank if unknown.'))+field('Reorder point',input('reorder',i?.reorder_point,`type="number" min="0" step="1" ${lock}`),'At or below this count triggers a request.')+field('Target stock',input('target',i?.target_stock,`type="number" min="0" step="1" ${lock}`),'Target must exceed the reorder point.')+field('Supplier (optional)',input('supplier',i?.supplier||'',`maxlength="100" ${lock}`))+ (isSup()?field('Unit cost, USD (optional)',input('cost',i?.unit_cost_usd,`type="number" min="0" step="0.01"`),'Demo input; no price supplied by the workbook.'):'');

  }

  function openDemo(){if(!isSup())return false;const sid=defaultSite();dialog('Try replenishment · demo','<p>Create one clearly simulated spare at a selected site. Starting stock: <strong>4</strong>, reorder point: <strong>2</strong>, target: <strong>8</strong>. No price is added.</p>'+field('Demo site',select('demo-site',DATA.sites.map(s=>[s.site_id,s.site_name]),sid))+'<div class="sp-draft-notice">Site automation will be enabled. Then issue 3 units to trigger a pending request for 7.</div>'+footer('Create demo spare','seed'),{kind:'demo'});return true;}

    if(a==='reset')resetDialog();if(a==='confirm-reset'){store().reset();query='';filter='all';page=0;tab='inventory';done('Spare-parts demo reset. HSE records are unchanged.');}
  }catch(e){error(e);}});
  document.addEventListener('change',event=>{const el=event.target;try{if(el.id==='sp-status'){filter=el.value;page=0;refresh();}if(el.id==='sp-site'&&dialogState?.kind==='item'&&!dialogState.id){const target=document.getElementById('sp-asset');target.innerHTML=assetOptions(el.value).map(([v,l])=>`<option value="${E(v)}">${E(l)}</option>`).join('');}if(el.dataset.spRule){store().setAutomation(el.dataset.spRule,el.checked);refresh();}}catch(e){error(e);refresh();}});

  window.addEventListener('viewchange',resetView);

  const editDistance = (a,b) => {if(Math.abs(a.length-b.length)>1)return 2;const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prior=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prior+(a[i-1]===b[j-1]?0:1));prior=old;}}return row[b.length];};
  function normalize(text){

  function chosenSites(q){

    if(/\b(hse|safety|hazard|hazards|critical|severity|overdue|closure|closures|loto|h2s)\b/.test(q))return 'hse';
    if(/\b(quality|reading|readings|sensor|sensors|missing|suspect|delayed|connectivity|network|offline|uptime)\b/.test(q))return 'quality';

    if(/\b(parts|spare|spares|inventory|stock|reorder|procurement|supply|replenishment)\b/.test(q))return 'parts';
    if(/\b(downtime|down time|outage|outages|bottleneck|bottlenecks|failure|failures|repair|dispatch|detection|stopped|reliability)\b/.test(q))return 'downtime';

    if(/\b(compare|comparison|versus|vs|worst|best|rank|ranking|sites)\b/.test(q))return 'comparison';

  }
  function action(label,kind,id,site,extra={}){return {label,kind,id,site,...extra};}
  const pageAction = (id,site) => permittedPage(id)?action('Open '+pageNames[id],'page',id,site):null;
  const chartAction = (id,site,period='current') => chartAccess(id)&&(period!=='future'||['oil-loss','production','financial','site-comparison'].includes(id))?action('View '+chartNames[id]+' chart','chart',id,site,{period}):null;
  const response = (text,source='',actions=[]) => ({text,source,actions:actions.filter(Boolean)});
  function dataFor(site){const d=workbook(),ev=scoped(d.events,site).filter(e=>e.event_type==='Unplanned'),sites=scoped(d.sites,site),hse=scoped(d.hse,site),p=scoped(d.production,site);return {ev,sites,hse,p,open:hse.filter(h=>h.action_status==='Open'),hours:total(ev,'stopped_hours'),parts:total(ev,'parts_wait_hours')};}

  function answerSource(){const d=workbook(),last=d.assets.map(a=>a.latest?.observed_utc).filter(Boolean).sort().at(-1);const duplicates=d.meta.cleaning.filter(s=>s.verifiedDuplicateRowsRemoved).map(s=>s.sheet+': '+fmt(s.verifiedDuplicateRowsRemoved,0)).join('; ');return response(`The source is ${d.meta.file}. Operating records cover 2025; latest sensor records are ${last?.slice(0,10)||'not supplied'}. HSE status is the ${d.meta.hseAsOf} workbook snapshot. This site has no live feed. Forecasts, when shown, are estimates derived from historical workbook values, not live results.\n\nVerified duplicate exports were removed (${duplicates}). Missing sensor values and unknown invoices remain unavailable.`, 'ReadMe, Assets, Events, Production, Readings, HSE',[action('View source details','source')]);}
  function answerAccess(){const role=context().role;return response(`The three pages are Dashboard, Spare Parts and HSE Actions. ${role==='Supervisor'?'Supervisors can configure inventory and site rules, review replenishment requests, approve or cancel demo orders, and record stock movements.':role==='Technician'?'Technicians can inspect stock, record issues/counts and receive approved demo orders. They cannot configure automation or approve requests.':'HSE Supervisors can inspect Spare Parts in read-only mode and review safety actions.'}\n\nFinancial chart permissions remain role-specific. The page role selector and HSE Demo role are demonstrations, not production authentication. The guide can explain and navigate; it cannot approve purchases or alter records.`, 'Application view and workflow design',[pageAction('parts',context().site),pageAction('hse',context().site)]);}

  function answerHse(site,q){const d=dataFor(site),critical=d.open.filter(h=>h.potential_severity===5),hours=total(d.open,'action_person_hours'),closed=d.hse.filter(h=>h.action_status==='Closed');const due=d.open.filter(h=>h.due_date&&h.due_date<workbook().meta.hseAsOf);let text=`${name(site)} ${site==='all'?'have':'has'} ${d.open.length} open HSE actions, including ${critical.length} severity-5 actions, and ${closed.length} closed actions. Open actions require ${fmt(hours,0)} person-hours in the workbook. ${due.length} open actions were overdue at the source snapshot (${workbook().meta.hseAsOf}).`;if(/\b(critical|worst|hazard|hazards|list|which|h2s|loto)\b/.test(q)&&critical.length)text+='\n\nCritical open records: '+critical.map(h=>`${h.hse_id} · ${name(h.site_id)} · ${h.hazard}`).join('; ')+'.';return response(text,'HSE · source status snapshot',[pageAction('hse',site),chartAction('hse',site)]);}
  function answerParts(site,q){const d=dataFor(site),waits=d.ev.filter(e=>e.parts_wait_hours>0),fill=d.sites.map(s=>`${s.site_name} ${fmt(s.spare_fill_pct,0)}%`).join(', ');const items=root.PartsStore?.getItems(site)||[],orders=root.PartsStore?.getOrders(site)||[],pending=orders.filter(o=>o.status==='Pending approval'),active=orders.filter(o=>['Pending approval','Approved','Partially received'].includes(o.status));let text=`${name(site)} · ${items.length} demo inventory records, ${active.length} open demo orders, ${pending.length} awaiting approval. The workbook does not supply a part catalog, inventory balances, suppliers or purchase orders. New entries are simulated and saved in this browser.\n\n2025 source history: ${fmt(d.parts)} parts-wait equipment-hours across ${waits.length} unplanned events. Local spare fill: ${fill}.`;
    if(/\b(auto|automatic|automated|automation|reorder|replenishment|rule|rules)\b/.test(q))text+='\n\nEnable auto-replenishment for each site and configure a part’s stock count, reorder point and target. When inventory position (on hand + outstanding order quantity) reaches the reorder point, the app creates one request for target minus inventory position. An existing open request prevents duplicates. Requests require supervisor approval; no purchase is sent to a supplier.';

    if(/\b(start|help|how|demo|try|add|configure)\b/.test(q))text+='\n\nStart with Add part, choose its site and asset, and enter counts and thresholds. Or choose Try demo to load an explicitly simulated kit for one site. Supervisors configure and approve; technicians record movements and approved receipts; HSE Supervisors have read-only parts access.';

  function answerDowntime(site,q){if(!isFinance())return response('Detailed downtime analysis is restricted to the Supervisor dashboard. Your current pages include Spare Parts and HSE Actions.','Application permission design',[pageAction('parts',site),pageAction('hse',site)]);const d=dataFor(site),causes=[...new Set(d.ev.map(e=>e.cause))].map(c=>[c,total(d.ev.filter(e=>e.cause===c),'stopped_hours')]).sort((a,b)=>b[1]-a[1]);const stages=[['Detection','detect_hours'],['Dispatch','dispatch_hours'],['Parts wait','parts_wait_hours'],['Repair','repair_hours'],['Restart','restart_hours']].map(([label,key])=>[label,total(d.ev,key)]).sort((a,b)=>b[1]-a[1]);let text=`${name(site)} recorded ${fmt(d.hours)} unplanned equipment-hours across ${d.ev.length} events in 2025 (${fmt(d.ev.length?d.hours/d.ev.length:0)} h per event).`;if(causes[0])text+=` Largest cause: ${causes[0][0]}, ${fmt(causes[0][1])} h (${fmt(causes[0][1]/d.hours*100)}%).`;if(stages[0])text+=` Largest delay stage: ${stages[0][0]}, ${fmt(stages[0][1])} h.`;if(/\b(stage|stages|breakdown|bottleneck|bottlenecks)\b/.test(q))text+='\n\n'+stages.map(([n,h])=>n+': '+fmt(h)+' h').join('; ')+'.';text+='\n\nCause categories and delay stages describe the same events; do not add them together.';return response(text,'Events · Unplanned records only',[chartAction('downtime',site),pageAction('parts',site)]);}

  function persist() {

  function gate(siteId) {

})();

    const a=ArroyoInsights,m=a.metrics(site),s=a.scenario(site);
    if(kind==='ranking')dataModal('Parts delays · all six sites',['Site','Parts wait h','Affected events','Share of site downtime','Source fill'],a.allSites().map(r=>[r.site_name,num(r.parts_wait_hours,2),r.parts_affected_events,num(r.parts_share_pct,2)+'%',num(r.source_spare_fill_pct,0)+'%']),'2025 unplanned events: sum Events.parts_wait_hours; share = parts wait ÷ stopped hours. Assets.spare_fill_pct is a case planning assumption, not current inventory. Each site input counted once.');
    else if(kind==='monthly')dataModal(m.site_name+' · monthly parts wait',['2025 month','Parts wait h','Affected events'],m.monthly.map(r=>[r.label,num(r.parts_wait_hours,2),r.affected_events]),'Events: unplanned rows assigned to their event-start month. Hours are equipment-hours; concurrent asset outages can overlap.');
    else if(kind==='assets')dataModal(m.site_name+' · equipment priorities',['Asset','Equipment','Parts wait h','Affected events'],m.assets.map(r=>[r.asset_id,r.asset_type,num(r.parts_wait_hours,2),r.affected_events]),'Events + Assets · 2025 unplanned events. Equipment groups guide inventory investigation; the workbook does not identify the missing SKU.');
    else if(kind==='scenario'){
      const o=DATA.options.find(x=>x.option_id==='O4');
      const rows=[['Historical parts wait',num(s.baseline_parts_wait_hours,2)+' h'],['Base parts-wait reduction',num(s.parts_wait_reduction*100,0)+'%'],['Modeled hours avoided',num(s.saved_parts_wait_hours,2)+' h'],['Remaining parts wait',num(s.remaining_parts_wait_hours,2)+' h'],['Historical unplanned downtime',num(s.baseline_unplanned_hours,2)+' h'],['Modeled remaining unplanned downtime',num(s.remaining_unplanned_hours,2)+' h'],['O4 implementation effort',o.install_person_hours+' person-hours per site'],['O4 lead time',o.lead_months+' month'],['O4 prerequisite',o.prerequisite]];
      if(PERMISSIONS[state.role].finance)rows.push(['O4 setup / selected site',money(o.setup_usd)],['O4 recurring / year / selected site',money(o.annual_usd)]);
      dataModal(m.site_name+' · O4 case scenario',['Measure','Value'],rows,'Solutions!S5: 60% × selected site’s 2025 unplanned parts-wait hours. Full comparable operating year after implementation, not first-year cash savings or guaranteed performance. Other stages, including protected safety work, are unchanged. O4 costs exclude additional site preparation and HSE corrective work; these are not a total rollout budget. Source: Solutions row 5; Events.');
    } else return false;
    return true;
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-af-site],[data-af-hse],[data-af-table],[data-af-dashboard]');if(!b)return;
    if(b.dataset.afSite){if(DATA.sites.some(s=>s.site_id===b.dataset.afSite))changeSite(b.dataset.afSite);return;}
    if(b.dataset.afHse){const h=DATA.hse.find(r=>r.hse_id===b.dataset.afHse);if(!h||!allowed('hse'))return;if(state.site!==h.site_id)changeSite(h.site_id);openRecord('hse',h.hse_id);return;}
    if(b.dataset.afTable)showData(b.dataset.afTable,b.dataset.afFocus);
    if(b.hasAttribute('data-af-dashboard'))AnalyticsUI.showOverview();
  });
  window.ArroyoEvidence=Object.freeze({showData});
})();

</script>
</body></html>
